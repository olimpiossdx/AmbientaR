[common]
# Configurações gerais do AmbientaR
site_name = ambientar.local
db_host = localhost
db_port = 3306
db_name = ambientar
db_user = root
db_password = ambientar123
db_timeout = 30
db_max_retries = 3

[erpnext]
# Configurações do ERPNext
erpnext_version = 14.0.0
frappe_version = 14.0.0
install_apps = erpnext,ambientar_core,ambientar_reports

[ambientar_core]
# Configurações específicas do módulo ambiental
environmental_standards = true
report_templates = true
project_management = true
max_concurrent_operations = 5

[ambientar_reports]
# Configurações do sistema de relatórios
report_engine = weasyprint
template_path = apps/ambientar_reports/templates
output_path = sites/ambientar.local/public/files/reports
report_timeout = 60
async_processing = true

[development]
# Configurações de desenvolvimento
debug = true
developer_mode = true
auto_reload = true
log_level = INFO
