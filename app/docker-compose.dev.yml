version: '3.8'

services:
  # Banco de dados MariaDB simplificado
  db:
    image: mariadb:10.6
    container_name: ambientar_db_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ambientar123
      MYSQL_DATABASE: ambientar
      MYSQL_USER: ambientar
      MYSQL_PASSWORD: ambientar123
    volumes:
      - db_data_dev:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - ambientar_dev_network
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=256M

  # Aplicação principal AmbientaR (sem Redis inicialmente)
  app:
    build: .
    container_name: ambientar_app_dev
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=ambientar
      - DB_USER=ambientar
      - DB_PASSWORD=ambientar123
      - DEBUG=true
      - LOG_LEVEL=INFO
    volumes:
      - ./apps:/app/apps
      - ./config:/app/config
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    networks:
      - ambientar_dev_network
    command: python main.py

volumes:
  db_data_dev:

networks:
  ambientar_dev_network:
    driver: bridge
