# Gate rápido de coordenadas em PRs e pushes (sem deploy).
name: Coordinates check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  coordinates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: coordinates:check
        run: npm run coordinates:check
