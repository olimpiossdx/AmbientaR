# MCA micro-agent registry — 48 agentes
agents:
  MCA_Orchestrator_Master:
    family: orchestration
    mode: deterministic
    etapa_min: 3
    depends_on: []
    produces: META_ORCHESTRATION
  MCA_DAG_Resolver:
    family: orchestration
    mode: deterministic
    etapa_min: 3
    depends_on: []
    produces: META_DAG
  MCA_Conflict_Merger:
    family: orchestration
    mode: deterministic
    etapa_min: 10
    depends_on: [MCA_Uso_Lavoura, MCA_APP_Polygon, MCA_RL_Gleba_Polygon]
    produces: QA_CONFLITOS
  MCA_Score_Aggregator:
    family: orchestration
    mode: deterministic
    etapa_min: 15
    depends_on: [MCA_QA_Topology, MCA_QA_Visual_Fidelity]
    produces: META_SCORE
  MCA_QA_Topology:
    family: qa
    mode: deterministic
    etapa_min: 5
    depends_on: [MCA_CRS_SIRGAS_UTM]
    produces: QA_TOPOLOGY
  MCA_QA_Visual_Fidelity:
    family: qa
    mode: deterministic
    etapa_min: 15
    depends_on: [MCA_Layout_Export_PDF]
    produces: QA_VISUAL
  MCA_Ingest_Perimeter:
    family: ingest
    mode: deterministic
    etapa_min: 5
    depends_on: []
    produces: BASE_PERIMETRO
  MCA_Ingest_KML_SHP:
    family: ingest
    mode: deterministic
    etapa_min: 5
    depends_on: []
    produces: BASE_PERIMETRO
  MCA_Learn_DWG_Ingest:
    family: learn
    mode: deterministic
    etapa_min: 6
    depends_on: [MCA_Ingest_Perimeter]
    produces: DWG_IMPORT
  MCA_CRS_SIRGAS_UTM:
    family: ingest
    mode: deterministic
    etapa_min: 5
    depends_on: [MCA_Ingest_Perimeter]
    produces: BASE_PERIMETRO
  MCA_Tile_Splitter:
    family: ingest
    mode: deterministic
    etapa_min: 14
    depends_on: [MCA_Base_Satellite]
    produces: IA_TILES
  MCA_Fund_Limite_Propriedade:
    family: fund
    mode: deterministic
    etapa_min: 7
    depends_on: [MCA_CRS_SIRGAS_UTM]
