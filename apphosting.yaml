# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

# Chave pública Web Push (Firebase Console → Cloud Messaging). Pode sobrescrever na consola App Hosting.
# Outras flags: ver docs/APP-HOSTING-VARIAVEIS.md e src/lib/deploy-flags.ts
env:
  - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    value: BN07XDzDLZThaAoYogVyfwwmBlmfQ8NCpqITt5nW3Ml4dqZIkTcehy9JEHkYilEvH3eWg-XsGMO8Bleh78qZTKo
    availability:
      - BUILD
      - RUNTIME

  # POST /api/ai-lab/import-reference-files — desativado por omissão (503). Só ative se os ficheiros
  # existirem no disco do container em produção (pasta no bundle ou path montado).
  # - variable: ENABLE_AI_LOCAL_IMPORT
  #   value: "true"
  #   availability:
  #     - RUNTIME

  # Rotas /api/* no middleware (em CI/deploy costuma ser true). Descomente se o backend precisar.
  # - variable: ENABLE_NEXT_API_ROUTES
  #   value: "true"
  #   availability:
  #     - RUNTIME

  # Fiscal Ambiental Digital — workers Cloud Run (WORKER_SHARED_SECRET: definir na consola, não commitar)
  - variable: FISCAL_SATELLITE_WORKER_URL
    value: https://ambientar-fiscal-satellite-485112911461.southamerica-east1.run.app
    availability:
      - RUNTIME
  - variable: FISCAL_INTELLIGENCE_WORKER_URL
    value: https://ambientar-fiscal-intelligence-485112911461.southamerica-east1.run.app
    availability:
      - RUNTIME

  # Biblioteca IA OneDrive (cloud-rag) + Integração OneDrive — docs/CLOUD-RAG-ONEDRIVE.md
  # Secrets: firebase apphosting:secrets:set MICROSOFT_GRAPH_* (ver doc)
  - variable: ONEDRIVE_SYNC_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: ONEDRIVE_RAG_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: ONEDRIVE_RAG_SEARCH_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_ONEDRIVE_RAG_SEARCH_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  - variable: ONEDRIVE_LIBRARY_ROOT_PATH
    value: Pimenta Ltda
    availability:
      - RUNTIME
  - variable: ONEDRIVE_DRIVE_NAME_HINT
    value: Pimenta
    availability:
      - RUNTIME
  - variable: MICROSOFT_GRAPH_TENANT_ID
    secret: MICROSOFT_GRAPH_TENANT_ID
    availability:
      - RUNTIME
  - variable: MICROSOFT_GRAPH_CLIENT_ID
    secret: MICROSOFT_GRAPH_CLIENT_ID
    availability:
      - RUNTIME
  - variable: MICROSOFT_GRAPH_CLIENT_SECRET
    secret: MICROSOFT_GRAPH_CLIENT_SECRET
    availability:
      - RUNTIME
